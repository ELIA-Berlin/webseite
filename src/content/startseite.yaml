unterzeile: Exploration, Learning & Innovation in Aerospace
titel: Studentische Raumfahrt aus Berlin.
einleitung: >-
  ELIA ist die Raumfahrtinitiative an der HTW Berlin und Nachwuchsgruppe der
  DGLR. Wir bauen Raketen und Rover und beschäftigen uns mit Recht und
  Wirtschaft im All.
knopfMitmachen: Mitmachen
knopfThemen: Unsere Themen
werWirSindTitel: Wer wir sind
werWirSindText: |-
  Bei uns arbeiten Studierende aus Technik, Informatik, Wirtschaft und Recht an echten Raumfahrtprojekten. Vorwissen brauchst du keins, nur Lust aufs Mitbauen.

  Vom ersten Modellraketenstart bis zum Rover für die European Rover Challenge lernen wir, wie Raumfahrt in der Praxis funktioniert.
