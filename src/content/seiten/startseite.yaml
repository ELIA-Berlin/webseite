titel: Wir bauen Raketen, Rover und die Ideen dahinter.
einleitung: >-
  ELIA ist die studentische Raumfahrtinitiative an der HTW Berlin und
  Nachwuchsgruppe der Deutschen Gesellschaft für Luft- und Raumfahrt (DGLR).
  Studierende aus Technik, Informatik, Wirtschaft und Recht arbeiten bei uns
  gemeinsam an echten Raumfahrtprojekten.
ueberUns: >-
  Bei uns zählt, was du lernen willst, nicht was du schon kannst. Wir
  konstruieren Modellraketen, entwickeln einen Rover für die European Rover
  Challenge und arbeiten auf die European Rocketry Challenge hin. Dazu kommen
  Fragen, die in der Raumfahrt genauso wichtig sind: Wem gehört der Weltraum,
  und wie wird aus einer Idee ein Unternehmen?
mitmachenTitel: Mach mit
mitmachenText: >-
  Du studierst an der HTW Berlin und hast Lust auf Raumfahrt? Egal ob du
  löten, programmieren, verhandeln oder Verträge lesen willst, wir finden
  ein Projekt für dich. Schreib uns oder komm zu einem unserer Treffen.
sponsorenText: >-
  Studentische Raumfahrt lebt von Partnern, die Material, Know-how oder
  Budget beisteuern. Wenn du uns unterstützen möchtest, melde dich bei uns.
