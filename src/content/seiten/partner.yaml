      Elektronik, Werkstoffe oder Fertigungszeit an Ihren Maschinen bringen
      unsere Projekte direkt voran.
  - titel: Wissen und Kontakte
    text: >-
      Mentoring, Workshops oder ein Blick in Ihr Unternehmen helfen
      Studierenden, Raumfahrt in der Praxis kennenzulernen.
