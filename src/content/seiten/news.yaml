abbinderTitel: Über ELIA
abbinder: >-
  ELIA (Exploration, Learning & Innovation in Aerospace) ist die studentische Raumfahrtinitiative an der HTW Berlin und Nachwuchsgruppe der DGLR. Wir bauen Modellraketen und Rover, nehmen an europäischen Wettbewerben teil und beschäftigen uns mit Space Law und Entrepreneurship. Mehr über uns und wie du mitmachen kannst: eliaspace.de
