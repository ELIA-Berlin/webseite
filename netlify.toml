[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Sicherheits-Header für alle Seiten.
# Die Seite lädt nichts von fremden Servern (Schriften und Bilder liegen hier),
# deshalb erlaubt die Content-Security-Policy nur eigene Quellen.
# 'unsafe-inline' ist nötig, weil Astro kleine Skripte und Styles direkt ins HTML schreibt.
# Wer später Videos, Karten oder externe Bilder einbindet, muss die Policy hier erweitern.
# Der Online-Editor braucht zusätzlich api.github.com (connect-src) und GitHub-Avatare (img-src).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"

# Gebaute Dateien (Name enthält einen Hash) dürfen lange im Browser-Cache bleiben.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
