# Baut die Webseite und veröffentlicht sie auf GitHub Pages (eliaspace.de).
#
# Läuft automatisch
#   - bei jeder Änderung auf `main` (auch aus dem Editor oder dem Kalender-Abgleich),
#   - jede Nacht einmal, damit datumsabhängige Inhalte (z. B. kommende Termine) aktuell bleiben,
#   - und auf Knopfdruck: Repo → Actions → „Webseite veröffentlichen“ → Run workflow.
#
# Kostenlos für öffentliche Repos. Fehler sieht man im Reiter „Actions“.
name: Webseite veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # täglich 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Veröffentlichungen gleichzeitig; eine laufende wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
